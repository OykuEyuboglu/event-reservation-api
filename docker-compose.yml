services:

  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_DB: event_reservation_api_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: redis

    ports:
      - "6379:6379"

  app:
    build: .

    depends_on:
      - postgres
      - redis

    ports:
      - "8080:8080"